suite: test some attributes of the kafka brokers
capabilities:
  apiVersions:
    - kafka.strimzi.io/v1/KafkaNodePool
templates:
  - templates/kafka-brokers.yaml
tests:

- it: kafka container resources should not be set for local cluster
  values:
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: spec.resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits but Strimzi doesn't support it
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests but Strimzi doesn't support it
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests but Strimzi doesn't support it
      pattern: "^[1-9].*"
  - matchSnapshot: {}

- it: kafka container resources should be set for development cluster
  values:
  - ../values-development.yaml
  asserts: &kafkaResourcesAsserts
  - matchRegex:
      path: spec.resources.limits.cpu
      # on non-local cluster we expect non 0 cpu limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.limits.memory
      # on non-local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.cpu
      # on non-local cluster we expect non 0 cpu requests
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.memory
      # on non-local cluster we expect non 0 memory requests
      pattern: "^[1-9].*"
  - matchSnapshot: {}

- it: kafka container resources should be set for production cluster
  values:
  - ../values-production.yaml
  asserts: *kafkaResourcesAsserts

- it: kafka broker name
  asserts:
  - equal:
      path: metadata.name
      value: kafka
  - matchSnapshot: {}

- it: uses 1 broker replica on the local cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - equal:
      path: spec.replicas
      value: 1

- it: uses 3 broker replicas on the development cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  asserts: &brokerReplicasAssert
  - equal:
      path: spec.replicas
      value: 3

- it: uses 3 broker replicas on the production cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts: *brokerReplicasAssert

- it: sets the broker persistent nfs1 storage volume
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - equal:
      path: spec.storage.volumes[?(@.id == 0)].type
      value: persistent-claim
  - equal:
      path: spec.storage.volumes[?(@.id == 0)].class
      value: nfs1
  - equal:
      path: spec.storage.volumes[?(@.id == 0)].size
      value: 1Gi
  # deleteClaim: false falls through `default` and renders as null; both
  # keep the PVCs on deletion, so accept either but never true
  - isNullOrEmpty:
      path: spec.storage.volumes[?(@.id == 0)].deleteClaim
