suite: kafka controller KafkaNodePool per stage
capabilities:
  apiVersions:
    - kafka.strimzi.io/v1/KafkaNodePool
templates:
  - templates/kafka-controllers.yaml
tests:

- it: sets non-zero controller resources on the local cluster
  values:
    - ../values-local.yaml
  asserts:
  - matchRegex:
      path: spec.resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits but Strimzi doesn't support it
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests but Strimzi doesn't support it
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests but Strimzi doesn't support it
      pattern: "^[1-9].*"
  - matchSnapshot: {}

- it: sets non-zero controller resources on the development cluster
  values:
  - ../values-development.yaml
  asserts: &kafkaControllerResourcesAsserts
  - matchRegex:
      path: spec.resources.limits.cpu
      # on non-local cluster we expect non 0 cpu limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.limits.memory
      # on non-local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.cpu
      # on non-local cluster we expect non 0 cpu requests
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.resources.requests.memory
      # on non-local cluster we expect non 0 memory requests
      pattern: "^[1-9].*"
  - matchSnapshot: {}

- it: sets non-zero controller resources on the production cluster
  values:
  - ../values-production.yaml
  asserts: *kafkaControllerResourcesAsserts

- it: names the controller node pool kafka-controller
  asserts:
  - equal:
      path: metadata.name
      value: kafka-controller
  - matchSnapshot: {}

- it: uses 1 controller replica on the local cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - equal:
      path: spec.replicas
      value: 1

- it: uses 5 controller replicas on the development cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  asserts: &controllerReplicasAssert
  - equal:
      path: spec.replicas
      value: 5

- it: uses 5 controller replicas on the production cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts: *controllerReplicasAssert

- it: sets the controller persistent nfs1 storage volume
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - equal:
      path: spec.storage.volumes[?(@.id == 0)].type
      value: persistent-claim
  - equal:
      path: spec.storage.volumes[?(@.id == 0)].class
      value: nfs1
  - equal:
      path: spec.storage.volumes[?(@.id == 0)].size
      value: 1Gi
  # deleteClaim: false falls through `default` and renders as null; both
  # keep the PVCs on deletion, so accept either but never true
  - isNullOrEmpty:
      path: spec.storage.volumes[?(@.id == 0)].deleteClaim
