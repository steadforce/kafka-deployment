---
# Source: akhq/templates/kafka.yaml
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
  name: kafka
spec:
  kafka:
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: "true"
      default.replication.factor: 3
      min.insync.replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
    rack:
      topologyKey: kubernetes.io/hostname
    template:
      clusterRoleBinding:
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: Prune=false
            argocd.argoproj.io/compare-options: IgnoreExtraneous
    version: 4.1.1
  entityOperator:
    topicOperator:
      resources:
        limits:
          cpu: 400m
          memory: 288Mi
        requests:
          cpu: 20m
          memory: 256Mi
    userOperator:
      resources:
        limits:
          cpu: 400m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 192Mi
